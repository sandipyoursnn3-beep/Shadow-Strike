name: Build APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Prepare game files
        run: |
          mkdir -p www
          if [ -f shadow-strike.html ]; then
            cp shadow-strike.html www/index.html
          elif unzip -o shadow-strike.zip -d tmp; then
            cp "$(find tmp \( -name index.html -o -name '*.html' \) | head -1)" www/index.html
          else
            cp shadow-strike.zip www/index.html
          fi
          test -s www/index.html
      - run: npm install
      - run: npx cap add android
      - name: Landscape and fullscreen
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' $M
          sed -i 's#</style>#<item name="android:windowFullscreen">true</item></style>#' android/app/src/main/res/values/styles.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowStrike-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
